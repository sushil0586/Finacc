services:
  postgres:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    environment:
      POSTGRES_DB: finacc_perf_local
      POSTGRES_USER: finacc_perf
      POSTGRES_PASSWORD: finacc_perf_local_only
    ports:
      - "15432:5432"
    volumes:
      - finacc_perf_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finacc_perf -d finacc_perf_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.perf
    env_file:
      - perf/docker/.env.perf-local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: finacc_perf_local
      DB_USER: finacc_perf
      DB_PASSWORD: finacc_perf_local_only
      CACHE_BACKEND: redis
      CACHE_LOCATION: redis://redis:6379/1
      FINACC_PERF_ALLOWED_DB_NAMES: finacc_perf_local
      FINACC_PERF_ALLOWED_DB_HOSTS: postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18000:8000"
    volumes:
      - finacc_perf_media:/app/media
      - finacc_perf_static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python manage.py audit_performance_staging --strict --allow-db-name finacc_perf_local --allow-db-host postgres >/tmp/finacc_perf_audit.log 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "18080:80"
    volumes:
      - ./perf/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - finacc_perf_static:/staticfiles:ro
      - finacc_perf_media:/media:ro

volumes:
  finacc_perf_postgres:
  finacc_perf_media:
  finacc_perf_static:
