server {
    listen 80;
    server_name staging.yourdomain.com;

    root /var/www/finacc-staging;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Angular content-hashed lazy chunks are immutable between deployments.
    location ~* ^/chunk-[A-Z0-9]+\.js$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry-point filenames are stable and must be revalidated after deployment.
    location ~* ^/(?:index\.html|main\.js|polyfills\.js|styles\.css)$ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /media/ {
        alias /home/ubuntu/Finacc/media/;
    }

    location /static/ {
        alias /home/ubuntu/Finacc/staticfiles/;
    }
}
