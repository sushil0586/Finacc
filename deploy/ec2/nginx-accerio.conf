server {
    server_name 16.16.166.34 accerio.in www.accerio.in;

    root /var/www/accerio;
    index index.html;
    client_max_body_size 50M;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        alias /home/ubuntu/Finacc/staticfiles/;
        try_files $uri =404;
    }

    location /media/ {
        alias /home/ubuntu/Finacc/media/;
    }

    location ~* ^/chunk-[A-Z0-9]+\.js$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(?:index\.html|main\.js|polyfills\.js|styles\.css)$ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/accerio.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/accerio.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_tokens off;

    if ($host = www.accerio.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = accerio.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name 16.16.166.34 accerio.in www.accerio.in;
    return 404;
}
